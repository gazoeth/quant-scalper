[project]
name = "quant-scalper"
version = "0.1.0"
description = "Binance USDT-M futures 15m scalping bot: Chan Lun + Breaker Blocks + BB/RSI/EMA/MTF"
requires-python = ">=3.10"
authors = [{ name = "allen", email = "gazoeth@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.4.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pandas-stubs",
    "types-requests",
]

[project.scripts]
quant-scalper = "quant_scalper.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = [
    "E501", "B008",
    "E741",   # ambiguous l/I (we use `l` for low)
    "SIM102", # nested-if vs combined-and — readability is subjective
    "B905",   # explicit strict= on zip
    "C901",   # complexity — algorithmic code is naturally complex
    "F841",   # unused local kept for clarity in indicator math
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
